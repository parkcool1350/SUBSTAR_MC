<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="SUBSTAR MC">
  <meta name="color-scheme" content="dark">
  <title>SUBSTAR MC</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 32px 24px;
      background: #111214;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Malgun Gothic", sans-serif;
      text-align: center;
    }

    main { width: min(100%, 560px); }

    .label {
      margin: 0 0 16px;
      color: #a1a1aa;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.2em;
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 8vw, 56px);
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1.15;
    }

    .description {
      margin: 20px 0 0;
      color: #a1a1aa;
      font-size: 14px;
      line-height: 1.8;
      word-break: keep-all;
      overflow-wrap: anywhere;
      text-wrap: balance;
    }

    footer {
      margin-top: 48px;
      color: #94949d;
      font-size: 11px;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <main>
    <p class="label">RESOURCE PACKS</p>
    <h1>SUBSTAR MC</h1>
    <p class="description">깃허브 마인크래프트 서버 리소스</p>
    <footer>© SUBSTAR</footer>
  </main>
</body>
</html>
